[package]
name = "rs_ai_providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "(UNSTABLE; in active development) Cloud AI providers for the Rusty AI SDK. Includes: Claude, ChatGPT, Gemini, xAI Grok, Cloudflare Workers AI, Ollama, Portkey AI Gateway, Langfuse observability, OpenAI-compatible adapter with 9+ presets."

[features]
default = []
claude = ["dep:rs_ai_oauth"]
chatgpt = ["openai-compatible"]
cohere = []
gemini = []
voyage = []
openai-compatible = []
xai = []
cloudflare = []
ollama = []
portkey = []
langfuse = []

[dependencies]
rs_ai_core = { workspace = true }
rs_ai_oauth = { path = "../rs_ai_oauth", version = "0.2.35", optional = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
reqwest-eventsource = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
secrecy = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
pin-project-lite = { workspace = true }
urlencoding = "2.1"

[dev-dependencies]
tokio = { workspace = true }
eventsource-stream = { workspace = true }
