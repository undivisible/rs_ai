[package]
name = "rs_ai_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "(UNSTABLE; in active development) Core traits, types, middleware, cache config, UI stream, and observability for the Rusty AI SDK. Includes: LanguageModel trait, Prompt/StreamEvent types, Retry/Logging/Cache middleware, SSE/NDJSON encoders, tracing observability."

[features]
default = []
oauth = ["dep:rs_ai_oauth"]
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
pin-project-lite = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
url = { workspace = true, optional = true }
base64 = { workspace = true }
mime = { workspace = true }
moka = { workspace = true }
secrecy = { workspace = true }
reqwest = { workspace = true }
rs_ai_oauth = { path = "../rs_ai_oauth", version = "0.2.36", optional = true }

# telemetry (optional)
opentelemetry = { version = "0.27", optional = true, features = ["trace"] }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["registry"] }

[dev-dependencies]
tokio = { workspace = true }
rs_ai_testing = { path = "../rs_ai_testing" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
