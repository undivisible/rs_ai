[workspace]
resolver = "2"
members = [
    "crates/rs_ai_oauth",
    "crates/rs_ai_core",
    "crates/rs_ai_providers",
    "crates/rs_ai_local",
    "crates/rs_ai_testing",
    "crates/rs_ai",
    "examples/basic_text",
    "examples/stream_text",
    "examples/generate_object",
    "examples/stream_object",
    "examples/tool_loop",
    "examples/multimodal",
    "examples/local_android",
    "examples/local_apple",
    "examples/local_browser",
    "examples/local_windows",
    "examples/router",
    "examples/realtime_voice",
    "examples/gemini_live",
    "examples/agent_with_tools",
    "examples/streaming_tool_use",
    "examples/fluent_api",
]

[workspace.package]
version = "0.2.36"
edition = "2021"
rust-version = "1.88"
license = "ISC"
repository = "https://github.com/undivisible/rs_ai"
description = "Rust AI SDK with cloud and local providers"

[workspace.dependencies]
# Consolidated crates
rs_ai_core = { path = "crates/rs_ai_core", version = "0.2.36" }
rs_ai_providers = { path = "crates/rs_ai_providers", version = "0.2.36" }
rs_ai_local = { path = "crates/rs_ai_local", version = "0.2.36" }
rs_ai_testing = { path = "crates/rs_ai_testing", version = "0.2.36" }
rs_ai = { path = "crates/rs_ai", version = "0.2.36" }

# Async / streaming
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "blocking"] }
reqwest-eventsource = "0.6"
eventsource-stream = "0.2"

# Observability
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# Misc
bytes = "1"
moka = { version = "0.12", features = ["sync"] }
url = "2"
secrecy = "0.10"
base64 = "0.22"
mime = "0.3"
sha2 = "0.10"
getrandom = { version = "0.2", features = ["std"] }

# Real-time APIs (WebSocket)
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
